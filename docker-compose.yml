services:
  deepwiki:
    # Use the pre-built image (docker load deepwiki-open.tar) on intranet hosts.
    # If the image is absent, `docker compose up` will build it from Dockerfile.
    image: deepwiki-open:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8001}:${PORT:-8001}"  # API port
      - "3000:3000"  # Next.js port
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8001}
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:${PORT:-8001}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-api/logs/application.log}
      # Optional: trust a corporate/intranet CA bundle for internal TLS endpoints
      # (AI/embed gateway, SVN over https). Put your CA at certs/ca-certificates.crt
      # and uncomment the certs volume below together with these three vars:
      # - NODE_EXTRA_CA_CERTS=/certs/ca-certificates.crt
      # - SSL_CERT_FILE=/certs/ca-certificates.crt
      # - REQUESTS_CA_BUNDLE=/certs/ca-certificates.crt
    volumes:
      - ~/.adalflow:/root/.adalflow      # Persist repository and embedding data
      - ./api/logs:/app/api/logs          # Persist log files across container restarts
      # Optional (uncomment together with the three env vars above):
      # - ./certs:/certs:ro
    # Resource limits for docker-compose up (not Swarm mode)
    mem_limit: 6g
    mem_reservation: 2g
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8001}/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
